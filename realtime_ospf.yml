- name: 实时获取 OSPF 状态
  hosts: frrouting
  gather_facts: true 
  tasks:
    - name: 仅执行 OSPF 采集任务
      ansible.builtin.include_role:
        name: frr_inspection
        tasks_from: ospf

    - name: 更新前端 JSON 接口文件
      ansible.builtin.template:
        src: roles/frr_inspection/templates/ospf_status.json.j2
        dest: "./realtime/{{ inventory_hostname }}_ospf.json"
      delegate_to: localhost
